<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0086CB">
  <title>Sign In | Innate Chiropractic</title>
  <link rel="icon" href="assets/img/spine-symbol.png">
  <link rel="stylesheet" href="assets/css/innate-portal.css">
</head>
<body>
  <div class="ic-auth">
    <div class="ic-auth__brand">
      <p class="ic-auth__tagline">Confident.<br>Approachable.<br><span>Knowledgeable.</span></p>
      <p>Chiropractic and Functional Medicine care, all in one place.</p>
    </div>

    <div class="ic-auth__form-wrap">
      <form class="ic-auth__form" action="index.html" data-ic-validate>
        <img class="ic-auth__logo" src="assets/img/innate-logo.png" alt="Innate Chiropractic">
        <h1>Patient Sign In</h1>
        <p class="ic-text-muted">Welcome back. Sign in to view your visits, forms and care plan.</p>

        <div class="ic-field">
          <label class="ic-label" for="email">Email</label>
          <input class="ic-input" id="email" type="email" autocomplete="email" inputmode="email" required
                 data-ic-error="Please enter a valid email address.">
        </div>

        <div class="ic-field">
          <label class="ic-label" for="password">Password</label>
          <div class="ic-input-group">
            <input class="ic-input" id="password" type="password" autocomplete="current-password" required minlength="8"
                   data-ic-error="Password must be at least 8 characters.">
            <button class="ic-icon-btn" type="button" data-ic-password-toggle="password" aria-label="Show password">
              <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <div class="ic-row ic-mb-4">
          <label class="ic-check"><input type="checkbox"> Remember me</label>
          <span class="ic-spacer"></span>
          <a href="#" class="ic-text-blue" style="font-size: var(--ic-text-sm);">Forgot password?</a>
        </div>

        <button class="ic-btn ic-btn--gradient ic-btn--lg ic-btn--block" type="submit">Sign In</button>

        <div class="ic-section-break" aria-hidden="true"><span></span><span></span><span></span></div>

        <p class="ic-text-center ic-text-muted" style="font-size: var(--ic-text-sm);">
          New patient? <a href="#">Create your account</a><br>
          Need help? Call <a href="tel:7043613277">704.361.3277</a>
        </p>
      </form>
    </div>
  </div>

  <script src="assets/js/innate-portal.js"></script>
</body>
</html>
