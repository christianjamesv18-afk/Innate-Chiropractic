<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You | Innate Chiropractic Claremont</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#f7faf9;--card:#ffffff;--ink:#1C1E1D;--muted:#5b7280;--brand:#3A83C5;--brand-dark:#1C1E1D;--line:#e3ece9}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:'Inter','Open Sans',system-ui,sans-serif;line-height:1.6;min-height:100vh;display:flex;flex-direction:column}
  h1{font-family:'Montserrat','Poppins',sans-serif;color:var(--ink);line-height:1.25}
  main{flex:1;width:100%;max-width:640px;margin:0 auto;padding:24px 16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:32px 24px;box-shadow:0 6px 24px rgba(15,92,110,.06);text-align:center}
  .card h1{font-size:1.75rem;margin-bottom:10px}
  .card p.sub{color:var(--muted);font-size:1.05rem;margin-bottom:24px}
  .stars{font-size:1.9rem;color:#f2b632;letter-spacing:4px;margin-bottom:12px}
  .btn{display:block;width:100%;max-width:360px;margin:0 auto;min-height:54px;padding:15px 24px;border-radius:12px;background:var(--brand);color:#fff !important;font-family:'Montserrat',sans-serif;font-weight:700;font-size:1.15rem;text-align:center;text-decoration:none;box-shadow:0 8px 18px rgba(58,131,197,.30);transition:background .2s,transform .15s}
  .btn:hover,.btn:focus{background:var(--brand-dark);transform:translateY(-1px)}
  .note{font-size:.9rem;color:var(--muted);margin-top:18px}
  .note a{color:var(--brand);font-weight:600}
  .divider{height:1px;background:var(--line);margin:28px 0}
  .loc-links{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:10px}
  .loc-links a{color:var(--brand);font-weight:600;text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-size:.92rem}
  .form-wrap{text-align:left;margin-top:8px}
  @media (max-width:480px){.card{padding:26px 18px}.card h1{font-size:1.5rem}}
</style>
</head>
<body>
<main>
  <div class="card">
    <div class="stars" aria-hidden="true">&#9733;&#9733;&#9733;&#9733;&#9733;</div>
    <h1>Thank you! We're so glad you had a great visit.</h1>
    <p class="sub">Would you take a moment to share your experience on Google? It only takes a minute, and your kind words help families in Claremont discover the care that made a difference for you.</p>

    <a class="btn" href="https://g.page/r/CVPtKn-aZm0pEAE/review" target="_blank" rel="noopener">Leave a Google Review</a>
    <p class="note">Taking you to Google in <strong id="count">5</strong> seconds...</p>
  </div>
</main>
<script>
  // Auto redirect to Google after 5 seconds. The button is the backup.
  (function(){var s=5,el=document.getElementById('count');
    var t=setInterval(function(){s--;if(el)el.textContent=s;if(s<=0){clearInterval(t);window.location.href="https://g.page/r/CVPtKn-aZm0pEAE/review";}},1000);})();
</script>
</body>
</html>
